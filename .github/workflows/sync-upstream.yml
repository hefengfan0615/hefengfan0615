name: "Sync upstream"

on:
  schedule:
    # Weekly: Monday 03:00 UTC (Monday 11:00 Beijing time)
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source repo (master branch)
        run: |
          set -euxo pipefail
          rm -rf /tmp/source
          git clone --depth 1 --branch master \
            https://github.com/hefengfan0615/hefengfan0615.github.io.git \
            /tmp/source

      - name: Clone target repo (main branch) with token
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/target
          git clone --branch main \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/target
          cd /tmp/target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Save current workflows (must be preserved)
        run: |
          set -euxo pipefail
          rm -rf /tmp/workflows
          mkdir -p /tmp/workflows
          cp -a /tmp/target/.github/workflows/. /tmp/workflows/

      - name: Replace every file with source, except this workflow
        run: |
          set -euxo pipefail
          shopt -s dotglob
          cd /tmp/target
          # Remove every file/folder except .git (this also removes root .github)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          # Copy all source files (including dotfiles) into the repo root
          cp -a /tmp/source/. ./
          # Restore our own workflows so this workflow is never disabled/removed
          mkdir -p .github/workflows
          cp -a /tmp/workflows/. .github/workflows/

      - name: Commit and push if changed
        run: |
          set -euxo pipefail
          cd /tmp/target
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync files with hefengfan0615/hefengfan0615.github.io [skip ci]"
            git push origin main
          fi