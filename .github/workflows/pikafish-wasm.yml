name: Pikafish WASM

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  EMSDK_PATH: /tmp/emsdk
  NNUE_URL: https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue

jobs:
  Pikafish-WASM:
    name: Pikafish WASM (multithreaded, NNUE -> .data)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git $EMSDK_PATH
          cd $EMSDK_PATH
          ./emsdk install latest
          ./emsdk activate latest
          echo "$EMSDK_PATH/upstream/emscripten" >> $GITHUB_PATH
          echo "$EMSDK_PATH" >> $GITHUB_PATH
          source $EMSDK_PATH/emsdk_env.sh
          echo "emcc: $(which emcc)"
          emcc --version

      - name: Download NNUE network
        run: |
          source $EMSDK_PATH/emsdk_env.sh
          curl -skL "${{ env.NNUE_URL }}" -o pikafish.nnue
          ls -lh pikafish.nnue

      # Step 1: build the WASM engine and package the NNUE network into a
      # standalone data file (pikafish.data) via --preload-file, exactly like
      # the reference Pikafish wasm branch. WASM_THREADS=yes links with
      # pthreads so the search runs off the main thread and the web page can
      # send "stop" to terminate it.
      - name: Build WASM and package NNUE into data file (pikafish.data)
        run: |
          source $EMSDK_PATH/emsdk_env.sh
          make -j$(nproc) build \
            ARCH=wasm32-relaxed-simd \
            CXX=em++ \
            COMP=gcc \
            WASM_THREADS=yes \
            EXE=pikafish.js
          echo "=== Build artifacts (NNUE packaged into pikafish.data) ==="
          ls -lh pikafish.js pikafish.wasm pikafish.data
          # With -pthread emcc normally emits a separate pikafish.worker.js.
          # Newer Emscripten may inline the worker into pikafish.js instead.
          if [ -f pikafish.worker.js ]; then
            ls -lh pikafish.worker.js
          else
            echo "(no separate pikafish.worker.js -> worker code is inlined in pikafish.js)"
          fi

      - name: Deploy wasm folder (js/wasm/data/worker + web page assets)
        run: |
          mkdir -p ../wasm
          cp -f pikafish.js        ../wasm/
          cp -f pikafish.wasm      ../wasm/
          cp -f pikafish.data      ../wasm/
          [ -f pikafish.worker.js ] && cp -f pikafish.worker.js ../wasm/ || true
          cp -f pikafish.nnue      ../wasm/
          cp -f emscripten/pikafish.html ../wasm/
          cp -f emscripten/serve.json    ../wasm/
          cp -f emscripten/test.js       ../wasm/
          ls -lh ../wasm/

      # Step 2: test exactly like the web page loads the engine
      # (Pikafish().then(...); engine.send_command(...)):
      #   - uci / isready handshake (NNUE data file is loaded from pikafish.data)
      #   - go depth 20 -> bestmove
      #   - go movetime 10000, then send "stop" 3 seconds later and verify the
      #     engine terminates well before the 10 s budget.
      - name: Web-style test (go depth 20, then movetime 10000 + stop)
        working-directory: wasm
        run: |
          node test.js pikafish.js

      - name: Commit WASM to master branch
        working-directory: ./
        run: |
          git config user.name "Pikafish Bot"
          git config user.email "pikafish-bot@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -f wasm/
          git commit -m "Update WASM build (multithreaded, NNUE data file) [skip ci]" || echo "No changes to commit"
          git push
