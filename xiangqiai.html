    <script>
        // 请求持久化存储：避免浏览器因站点配额/存储压力把 ~50MB 的引擎缓存
        // (CacheStorage) 按 LRU 回收，从而防止"隔一天不访问就要重新下载引擎文件"。
        // 关键事实：navigator.storage.persist() 对"非已安装 PWA"往往返回 false，
        // Chrome 只在用户手势或站点高活跃时授予持久化；因此这里在首次用户交互
        // (点击/键盘/触摸) 时再次请求，并把持久化结果输出到控制台便于核实。
        (function () {
            function report(label, persisted, granted) {
                if (window.console && console.log) {
                    console.log('[xiangqi-storage] ' + label +
                        ' persisted=' + persisted +
                        ' persistGranted=' + (granted === undefined ? 'n/a' : granted));
                }
            }
            function tryPersist() {
                if (!navigator.storage || typeof navigator.storage.persist !== 'function') { return; }
                navigator.storage.persist().then(function (granted) {
                    if (typeof navigator.storage.persisted === 'function') {
                        navigator.storage.persisted().then(function (p) {
                            report('persist', p, granted);
                        }).catch(function () { report('persist', 'n/a', granted); });
                    } else {
                        report('persist', 'n/a', granted);
                    }
                }).catch(function () {});
            }
            // 页面加载时先请求一次。
            tryPersist();
            // Chrome 在用户手势下更可能授予持久化：首次交互时再请求一次。
            var once = true;
            function onGesture() {
                if (!once) { return; }
                once = false;
                tryPersist();
                window.removeEventListener('click', onGesture);
                window.removeEventListener('keydown', onGesture);
                window.removeEventListener('touchstart', onGesture);
                window.removeEventListener('pointerdown', onGesture);
            }
            window.addEventListener('click', onGesture);
            window.addEventListener('keydown', onGesture);
            window.addEventListener('touchstart', onGesture);
            window.addEventListener('pointerdown', onGesture);
        })();
    </script>
    <script>
        // 阻止手机QQ内置浏览器加载ServiceWorker
        if (navigator.userAgent.includes('TBS')) {
            navigator.serviceWorker.register = () => new Promise(() => {});
        }

    <script>
        // 跨源隔离引导：GitHub Pages 无法直接下发 COOP/COEP 头，
        // 只能由 Service Worker 给首次导航响应注入。因此首次加载（无 SW 控制时）
        // 页面未隔离，SharedArrayBuffer 不可用。这里注册 SW，待它接管后一次性刷新，
        // 使文档经 SW 重新导航从而带上 COOP/COEP，达成跨源隔离。
        (function () {
            if (!('serviceWorker' in navigator)) { return; }
            var AUTO = 'xiangqi-co-auto';       // 1 = 上一次导航是本脚本注入的自动刷新
            var COUNT = 'xiangqi-co-count';     // 注入式自动刷新的次数（用于兜住恶性循环）
            var LAST = 'xiangqi-co-last';       // 上一次自动刷新的时间戳（简单限流）
            var MIN_MS = 1500;                  // 自动刷新的最小间隔
            var MAX_AUTO = 3;                   // 自动刷新次数上限，防止隔离迟迟不来时无限刷新

            function isIsolated() { return window.crossOriginIsolated === true; }
            function clearKeys() {
                sessionStorage.removeItem(AUTO);
                sessionStorage.removeItem(COUNT);
                sessionStorage.removeItem(LAST);
            }

            // 已隔离：本次会话完成，清除全部遗留标记便于后续环境变化时重走引导
            if (isIsolated()) { clearKeys(); return; }

            // 判断本次加载是否由我们注入的自动刷新触发
            var fromAuto = sessionStorage.getItem(AUTO) === '1';
            var n = parseInt(sessionStorage.getItem(COUNT) || '0', 10);
            sessionStorage.removeItem(AUTO); // 消费该标记
            // 手动/全新导航与自动刷新无关：计数清零
            if (!fromAuto) n = 0;

            var reloading = false;
            function doReload() {
                // 防止 controllerchange 与 setTimeout(ready) 并发触发重复刷新，
                // 避免双重重载竞争导致文档尚未经 SW 注入隔离头就被中断。
                if (reloading) { return; }
                if (isIsolated()) { clearKeys(); return; }
                reloading = true;
                sessionStorage.setItem(LAST, String(Date.now()));
                sessionStorage.setItem(AUTO, '1');
                sessionStorage.setItem(COUNT, String(n + 1));
                location.reload();
            }

            if (navigator.serviceWorker.controller) {
                // SW 已接管但尚未隔离。
                if (fromAuto) {
                    // 我们注入的刷新还没生效：受限流 + 次数上限兜底，防止无限刷新循环。
                    if (n < MAX_AUTO) {
                        setTimeout(function () {
                            if (isIsolated()) { clearKeys(); return; }
                            var now = Date.now(), last = parseInt(sessionStorage.getItem(LAST) || '0', 10);
                            if (now - last >= MIN_MS) doReload();
                        }, MIN_MS);
                    }
                } else {
                    // 手动刷新（用户主动行为）：立即重试一次，不受限流约束，
                    // 否则连点刷新时隔离一直被拖住，引擎进度会卡在 0%。
                    doReload();
                }
            } else {
                // 首次加载，SW 尚未接管：等它接管后刷新，使文档进入 SW 作用域以获得 COOP/COEP。
                navigator.serviceWorker.addEventListener('controllerchange', doReload);
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function () {
                    navigator.serviceWorker.ready.then(function () {
                        setTimeout(doReload, 200);
                    }).catch(function () {});
                }).catch(function () {});
            }
        })();
    </script>
