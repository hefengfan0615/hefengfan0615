    <script>
        // 请求持久化存储：避免浏览器因站点配额/存储压力把 ~50MB 的引擎缓存
        // (CacheStorage) 按 LRU 回收，从而防止"隔一天不访问就要重新下载引擎文件"。
        // 关键事实：navigator.storage.persist() 对"非已安装 PWA"往往返回 false，
        // Chrome 只在用户手势或站点高活跃时授予持久化；因此这里在首次用户交互
        // (点击/键盘/触摸) 时再次请求，并把持久化结果输出到控制台便于核实。
        (function () {
            function report(label, persisted, granted) {
                if (window.console && console.log) {
                    console.log('[xiangqi-storage] ' + label +
                        ' persisted=' + persisted +
                        ' persistGranted=' + (granted === undefined ? 'n/a' : granted));
                }
            }
            function tryPersist() {
                if (!navigator.storage || typeof navigator.storage.persist !== 'function') { return; }
                navigator.storage.persist().then(function (granted) {
                    if (typeof navigator.storage.persisted === 'function') {
                        navigator.storage.persisted().then(function (p) {
                            report('persist', p, granted);
                        }).catch(function () { report('persist', 'n/a', granted); });
                    } else {
                        report('persist', 'n/a', granted);
                    }
                }).catch(function () {});
            }
            // 页面加载时先请求一次。
            tryPersist();
            // Chrome 在用户手势下更可能授予持久化：首次交互时再请求一次。
            var once = true;
            function onGesture() {
                if (!once) { return; }
                once = false;
                tryPersist();
                window.removeEventListener('click', onGesture);
                window.removeEventListener('keydown', onGesture);
                window.removeEventListener('touchstart', onGesture);
                window.removeEventListener('pointerdown', onGesture);
            }
            window.addEventListener('click', onGesture);
            window.addEventListener('keydown', onGesture);
            window.addEventListener('touchstart', onGesture);
            window.addEventListener('pointerdown', onGesture);
        })();
    </script>

    <script>
        // 跨源隔离引导：GitHub Pages 无法直接下发 COOP/COEP 头，
        // 只能由 Service Worker 给首次导航响应注入。因此首次加载（无 SW 控制时）
        // 页面未隔离，SharedArrayBuffer 不可用。这里注册 SW，待它接管后一次性刷新，
        // 使文档经 SW 重新导航从而带上 COOP/COEP，达成跨源隔离。
        (function () {
            // ========================== SAB 弹窗 ==========================
            // 自动检测 SAB：只有浏览器【确实无法达成跨源隔离 / 无 SharedArrayBuffer】
            // 时才弹窗。样式与原"引擎版本更新"弹窗（Element MessageBox 风格）一致。
            // 不设"一次性守卫"：每次刷新/加载，只要仍不支持 SAB 就再次弹窗。
            function sabUnsupported() {
                if (document.getElementById('xiangqi-sab-modal')) { return; }
                try {
                    // 复用同一份 MessageBox 样式（对齐原弹窗），首次注入后全局生效
                    if (!document.getElementById('xiangqi-sab-style')) {
                        var st = document.createElement('style');
                        st.id = 'xiangqi-sab-style';
                        st.textContent =
                            '.xq-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);' +
                            'display:flex;align-items:center;justify-content:center;overflow:auto;' +
                            'box-sizing:border-box;padding:16px;}' +
                            '.xq-mbox{width:420px;max-width:92vw;background:#fff;border-radius:6px;' +
                            'box-shadow:0 12px 32px 4px rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.08);' +
                            'overflow:hidden;margin:auto;}' +
                            '.xq-mbox__header{padding:15px 15px 5px;}' +
                            '.xq-mbox__title{font-size:16px;line-height:24px;color:#303133;font-weight:600;}' +
                            '.xq-mbox__content{padding:6px 15px 0;}' +
                            '.xq-mbox__message{font-size:14px;line-height:1.6;color:#606266;}' +
                            '.xq-mbox__btns{padding:12px 15px 15px;text-align:right;}' +
                            '.xq-btn{display:inline-block;margin-left:8px;height:32px;padding:0 15px;' +
                            'font-size:14px;border:none;border-radius:4px;cursor:pointer;' +
                            'font-family:inherit;line-height:32px;box-sizing:border-box;}' +
                            '.xq-btn--primary{background:#409eff;color:#fff;}' +
                            '.xq-btn--primary:hover{background:#66b1ff;}';
                        document.head.appendChild(st);
                    }

                    var ov = document.createElement('div');
                    ov.id = 'xiangqi-sab-modal';
                    ov.className = 'xq-overlay';
                    var box = document.createElement('div');
                    box.className = 'xq-mbox';
                    box.setAttribute('role', 'dialog');
                    var hd = document.createElement('div');
                    hd.className = 'xq-mbox__header';
                    var title = document.createElement('div');
                    title.className = 'xq-mbox__title';
                    title.textContent = '提示';
                    hd.appendChild(title);
                    var ct = document.createElement('div');
                    ct.className = 'xq-mbox__content';
                    var msg = document.createElement('div');
                    msg.className = 'xq-mbox__message';
                    msg.textContent = '您的浏览器不支持SAB技术，请换一个浏览器试试吧~';
                    ct.appendChild(msg);
                    var btns = document.createElement('div');
                    btns.className = 'xq-mbox__btns';
                    var ok = document.createElement('button');
                    ok.className = 'xq-btn xq-btn--primary';
                    ok.textContent = '知道了';
                    ok.type = 'button';
                    ok.onclick = function () { try { document.body.removeChild(ov); } catch (e) {} };
                    btns.appendChild(ok);
                    box.appendChild(hd); box.appendChild(ct); box.appendChild(btns);
                    ov.appendChild(box);
                    document.body.appendChild(ov);
                } catch (e) { /* 渲染失败则静默 */ }
            }

            // body 可能尚未解析完成（本脚本位于 <head>），等到 DOM 就绪再挂载弹窗
            function showSAB() {
                if (document.body) { sabUnsupported(); return; }
                var onReady = function () {
                    document.removeEventListener('DOMContentLoaded', onReady);
                    sabUnsupported();
                };
                document.addEventListener('DOMContentLoaded', onReady);
            }

            // ========================== 引导逻辑 ==========================
            var AUTO = 'xiangqi-co-auto';       // 1 = 上一次导航是本脚本注入的自动刷新
            var COUNT = 'xiangqi-co-count';     // 注入式自动刷新的次数（兜底，防止 SW 无法接管时死循环）

            function isIsolated() { return window.crossOriginIsolated === true; }
            function clearKeys() {
                try {
                    sessionStorage.removeItem(AUTO);
                    sessionStorage.removeItem(COUNT);
                } catch (e) { /* 隐私模式下可能抛错，忽略 */ }
            }
            function getN() {
                try { var x = parseInt(sessionStorage.getItem(COUNT) || '0', 10); return isNaN(x) ? 0 : x; }
                catch (e) { return 0; }
            }

            // 已隔离：本次会话已完成引导，清除全部标记收工。
            if (isIsolated()) { clearKeys(); return; }

            // ① 连 Service Worker 都没有：GitHub Pages 无法下发 COOP/COEP 头，
            //    SAB 永远无法启用 → 直接弹窗，而不是一直卡在"加载 0%"
            if (!('serviceWorker' in navigator)) { showSAB(); return; }

            // 本页文档是否【已由 Service Worker 提供】：若为 true 说明本次导航已注入过
            // COOP/COEP，却仍未隔离 → 判定浏览器不支持 SAB。必须用脚本顶部的同步值，
            // 不能用 claim 中途变动的 controller，否则会把"还在转向隔离"误判为不支持。
            var controllerAtStart = navigator.serviceWorker.controller !== null;
            var fromAuto = false;
            try { fromAuto = sessionStorage.getItem(AUTO) === '1'; } catch (e) { /***/ }

            // ② 已由 SW 提供过（或上次已注入自动刷新）仍未隔离 → 弹窗。
            //    用户刷新后若仍不支持，同样命中这里，保证每次刷新都会再次弹窗。
            if (fromAuto || controllerAtStart) {
                showSAB();
                clearKeys();
                return;
            }

            // ③ 首次加载、SW 尚未接管：注册 SW，接管后刷新一次以注入 COOP/COEP。
            var n = getN();
            if (n >= 3) { showSAB(); clearKeys(); return; }

            var settled = false;   // 已进入刷新/收尾，后续不再弹窗
            var watchdog = null;
            function fireWatchdog() {
                if (settled) { return; }
                // 既未隔离、又迟迟没进入接管/刷新 → SAB 无法启用 → 弹窗兜底，避免卡死在 0%
                if (!isIsolated() && !navigator.serviceWorker.controller) {
                    settled = true;
                    showSAB();
                    clearKeys();
                }
            }
            // 守护定时器：处理"SW 注册被覆盖挂起 / 一直无法接管"等异常环境
            function armWatchdog() {
                if (watchdog) { clearTimeout(watchdog); }
                watchdog = setTimeout(fireWatchdog, 6000);
            }
            armWatchdog();

            function flushWatchdog() { if (watchdog) { clearTimeout(watchdog); watchdog = null; } }

            function doReload() {
                settled = true;
                flushWatchdog();
                try {
                    sessionStorage.setItem(AUTO, '1');
                    sessionStorage.setItem(COUNT, String(getN() + 1));
                } catch (e) { /* 忽略 */ }
                location.reload();
            }

            // SW 成功接管：刷新一次让本页由 SW 提供，从而带上 COOP/COEP。
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!settled && navigator.serviceWorker.controller) {
                    beforeReload();
                }
            });
            function beforeReload() {
                // ready/接管已就绪：取消守护，执行注入式刷新
                settled = true;
                flushWatchdog();
                doReload();
            }

            try {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function () {
                    armWatchdog(); // register 已推进，重置计时（装 SW 过程也算进度）
                    navigator.serviceWorker.ready.then(function () {
                        if (settled) { return; }
                        if (navigator.serviceWorker.controller) { beforeReload(); return; }
                        // 已激活但当前 client 尚未建立 controller：等 controllerchange，并给定时兜底
                        setTimeout(function () {
                            if (!settled && navigator.serviceWorker.controller) { beforeReload(); }
                            else if (!settled && !isIsolated()) { doReload(); }
                        }, 1200);
                        // 若 1200ms 后仍未接管但页面仍未隔离 → doReload 再试一次；
                        // 下次加载若仍未隔离会命中 ② 直接弹窗，不会无限循环。
                    }).catch(function () {
                        if (!settled) { settled = true; flushWatchdog(); showSAB(); }
                    });
                }).catch(function () {
                    if (!settled) { settled = true; flushWatchdog(); showSAB(); }
                });
            } catch (e) {
                settled = true; flushWatchdog(); showSAB();
            }
        })();
    </script>

    <noscript>

    <!-- built files will be auto injected -->
    <script>
        // 关于界面底部：只显示 引擎版本（来自引擎 UCI info 消息）和 最后更新时间（北京时间）。
        // 不修改压缩后的前端 bundle，用 MutationObserver 在"关于"对话框打开时注入。
        (function () {
            if (!window.MutationObserver) { return; }

            var boxes = [];          // 已注入的显示块
            var engineVersion = null; // 引擎 UCI "id name" 行里报告的版本

            // 引擎的每行输出被前端 bundle 以 " > " 前缀打到 console，
            // 其中 "id name Pikafish ..." 就是引擎自己报告的版本信息。
            (function () {
                var orig = console.log;
                console.log = function () {
                    try {
                        var s = Array.prototype.join.call(arguments, ' ');
                        if (s.indexOf(' > id name ') === 0) {
                            engineVersion = s.slice(' > id name '.length).trim();
                            rerenderAll();
                        }
                    } catch (e) { /* 忽略 */ }
                    return orig.apply(console, arguments);
                };
            })();

            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            // version.json 里的 ISO 时间（UTC+00:00）转北京时间 (UTC+8) 显示
            function beijingTime(iso) {
                var d = new Date(iso);
                if (isNaN(d.getTime())) { return '未知'; }
                var b = new Date(d.getTime() + 8 * 3600 * 1000);
                function p(n) { return (n < 10 ? '0' : '') + n; }
                return b.getUTCFullYear() + '-' + p(b.getUTCMonth() + 1) + '-' + p(b.getUTCDate()) +
                    ' ' + p(b.getUTCHours()) + ':' + p(b.getUTCMinutes()) + ':' + p(b.getUTCSeconds());
            }

            function row(title, value) {
                return '<div style="font-weight:700;margin:12px 0 2px">' + esc(title) + '</div>' +
                    '<div>' + esc(value) + '</div>';
            }

            function render(box) {
                box.innerHTML = row('引擎版本', engineVersion || '加载中…');
                fetch('/version.json', { cache: 'no-store' })
                    .then(function (r) {
                        if (!r.ok) { throw new Error('HTTP ' + r.status); }
                        return r.json();
                    })
                    .catch(function () { return null; })
                    .then(function (info) {
                        box.innerHTML = row('引擎版本', engineVersion || '加载中…') +
                            row('最后更新时间', info && info.updatedAt ? beijingTime(info.updatedAt) : '未知');
                    });
            }

            function rerenderAll() {
                boxes.forEach(function (b) { render(b); });
            }

            function tryInject() {
                var about = document.querySelector('.about');
                if (!about) { return false; }
                var content = about.querySelector('.content');
                if (!content) { return false; }
                if (content.getAttribute('data-xiangqi-about-info')) { return true; }
                content.setAttribute('data-xiangqi-about-info', '1');
                var box = document.createElement('div');
                box.style.cssText = 'border-top:1px dashed #c5bdbd;margin-top:14px;padding:4px 20px 14px;' +
                    'font-size:0.8rem;color:#333;line-height:1.7;text-align:left;overflow:hidden';
                box.innerHTML = '<div>加载中…</div>';
                content.appendChild(box);
                boxes.push(box);
                render(box);
                return true;
            }

            var tries = 0;
            function onMaybeOpen() {
                if (tryInject()) { return; }
                if (++tries > 20) { return; }
                setTimeout(onMaybeOpen, 150); // 等 Vue 把对话框内容渲染完
            }

            new MutationObserver(onMaybeOpen).observe(document.documentElement, { childList: true, subtree: true });
            onMaybeOpen(); // 页面加载时若 About 已打开则立即尝试
        })();
    </script>
    <script>
        // 主动检查 Service Worker 本体（sw.js）是否有更新：检测到新版就自动接管并刷新一次。
        // 目的：让"引擎缓存同步校验"等最新 SW 逻辑尽快在用户浏览器里生效，
        // 否则浏览器默认最长 24 小时才检查一次 sw.js，导致改了引擎刷新却还用旧缓存。
        // 放在 HTML 里：HTML 走网络优先，每次都是最新版，能绕开"旧 SW 服务旧页面"的困境。
        (function () {
            if (!('serviceWorker' in navigator)) { return; }
            var KEY = 'xiangqi-sw-autoreload';
            var MAX = 2; // 每会话最多自动刷新 2 次，防止新旧交替时死循环
            var reloaded = false;

            function doReload() {
                if (reloaded) { return; }
                reloaded = true;
                window.location.reload();
            }

            function adoptNew(reg, n) {
                if (!reg.waiting || !navigator.serviceWorker.controller) { return; }
                sessionStorage.setItem(KEY, String(n + 1));
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                navigator.serviceWorker.addEventListener('controllerchange', doReload);
                setTimeout(doReload, 4000); // 兜底：controllerchange 未触发也能刷新
            }

            navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function (reg) {
                var n = parseInt(sessionStorage.getItem(KEY) || '0', 10);
                if (n >= MAX) { return; }

                if (reg.waiting && navigator.serviceWorker.controller) {
                    adoptNew(reg, n); // 已有新版在等待接管
                    return;
                }
                reg.addEventListener('updatefound', function () {
                    var w = reg.installing;
                    if (!w) { return; }
                    w.addEventListener('statechange', function () {
                        // 新版安装完成且页面已被旧 SW 控制 → 自动切换并刷新
                        if (w.state === 'installed' && navigator.serviceWorker.controller) {
                            adoptNew(reg, n);
                        }
                    });
                });
                // 强制绕过 HTTP 缓存检查 sw.js 更新
                if (typeof reg.update === 'function') { reg.update().catch(function () {}); }
            }).catch(function () {});
        })();
    </script>
