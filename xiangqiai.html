    <script>
        // 跨源隔离引导：GitHub Pages 无法直接下发 COOP/COEP 头，
        // 只能由 Service Worker 给首次导航响应注入。因此首次加载（无 SW 控制时）
        // 页面未隔离，SharedArrayBuffer 不可用。这里注册 SW，待它接管后一次性刷新，
        // 使文档经 SW 重新导航从而带上 COOP/COEP，达成跨源隔离。
        (function () {
            if (!('serviceWorker' in navigator)) { return; }
            var KEY = 'xiangqi-co-redirect';
            if (window.crossOriginIsolated) {
                sessionStorage.removeItem(KEY);
                return;
            }
            var reloaded = false;
            function tryIsolateAndReload() {
                // 已隔离：本次会话无需再处理
                if (window.crossOriginIsolated) {
                    sessionStorage.removeItem(KEY);
                    return;
                }
                // 一次性：仅隔离切换导出的那次刷新值得执行，避免刷新循环
                if (reloaded || sessionStorage.getItem(KEY)) { return; }
                reloaded = true;
                sessionStorage.setItem(KEY, '1');
                location.reload();
            }
            navigator.serviceWorker.addEventListener('controllerchange', tryIsolateAndReload);
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function () {
                // 不依赖 controller（claim 升级竞态可能失败）：只要 SW 处于
                // ready（已激活）态，location.reload() 作为一次新导航就会落在
                // SW 作用域内，由 SW 响应并注入 COOP/COEP，从而获得跨源隔离，
                // 这时多线程引擎才能正常创建 Worker 并传输 SharedArrayBuffer。
                navigator.serviceWorker.ready.then(function () {
                    setTimeout(tryIsolateAndReload, 300);
                }).catch(function () {});
            }).catch(function () {});
        })();
    </script>
