    <script>
        // 阻止手机QQ内置浏览器加载ServiceWorker
        if (navigator.userAgent.includes('TBS')) {
            navigator.serviceWorker.register = () => new Promise(() => {});
        }

    <script>
        // 跨源隔离引导：GitHub Pages 无法直接下发 COOP/COEP 头，
        // 只能由 Service Worker 给首次导航响应注入。因此首次加载（无 SW 控制时）
        // 页面未隔离，SharedArrayBuffer 不可用。这里注册 SW，待它接管后一次性刷新，
        // 使文档经 SW 重新导航从而带上 COOP/COEP，达成跨源隔离。
        (function () {
            if (!('serviceWorker' in navigator)) { return; }
            var KEY = 'xiangqi-co-redirect';
            if (window.crossOriginIsolated) {
                sessionStorage.removeItem(KEY);
                return;
            }
            function maybeReload() {
                if (window.crossOriginIsolated) {
                    sessionStorage.removeItem(KEY);
                    return;
                }
                if (navigator.serviceWorker.controller && !sessionStorage.getItem(KEY)) {
                    sessionStorage.setItem(KEY, '1');
                    location.reload();
                }
            }
            navigator.serviceWorker.addEventListener('controllerchange', maybeReload);
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function () {
                // SW 安装并激活后，等待片刻再次判断隔离状态。
                // 首次访问/首次安装时当前文档尚未被 SW 控制、也未带 COOP/COEP，
                // 因此必须刷新一次，让文档经 SW 重新导航才能真正获得跨源隔离。
                navigator.serviceWorker.ready.then(function () {
                    setTimeout(function () { maybeReload(); }, 1200);
                }).catch(function () {});
            }).catch(function () {});
        })();
    </script>
